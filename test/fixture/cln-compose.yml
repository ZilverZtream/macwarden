# Disposable regtest Core Lightning node for the rune comparison tests (1.2.0).
# No port is published: the tests run lightning-cli inside the container, so this
# fixture cannot collide with the LND fixture shards (18080-18480) or reach a real node.
services:
  bitcoind:
    image: lightninglabs/bitcoin-core:31.1@sha256:86e15e4348869a86343aacbbd1aff38e96cffddd87b61644694b1e1358d737cd
    command:
      - -regtest
      - -server=1
      - -rpcuser=fixture
      - -rpcpassword=fixture-only-disposable
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
  lightningd:
    image: elementsproject/lightningd:v26.06.8@sha256:56f1cebe829fbb3c7d5674be8cd1212c7e02527ab32403b695033a29bcd2abce
    depends_on:
      - bitcoind
    environment:
      LIGHTNINGD_NETWORK: regtest
    command:
      - --bitcoin-rpcconnect=bitcoind
      - --bitcoin-rpcport=18443
      - --bitcoin-rpcuser=fixture
      - --bitcoin-rpcpassword=fixture-only-disposable
      - --log-level=info
