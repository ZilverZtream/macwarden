# macwarden detectors as TruffleHog custom detectors.
# Usage: trufflehog filesystem . --config rules/trufflehog.yaml --no-verification
#        trufflehog git file://. --config rules/trufflehog.yaml --no-verification
# The regexes are byte-identical to docs/spec.md and rules/gitleaks.toml (a test enforces it).
# TruffleHog prints matched secrets in its output: store its results only where a
# leaked Lightning credential may be read, and rotate anything it finds (macwarden rotate).
detectors:
  - name: macwarden-macaroon-hex
    keywords:
      - '0201036c6e6402'
    regex:
      macaroon: '(?i)0201036c6e6402[0-9a-f]{40,}'
  - name: macwarden-macaroon-base64
    keywords:
      - 'AgEDbG5kA'
    regex:
      macaroon: 'AgEDbG5kA[A-Za-z0-9+/_-]{40,}={0,2}'
  - name: macwarden-lndconnect
    keywords:
      - 'lndconnect://'
    regex:
      uri: '(?i)lndconnect://[^\s"''<>]+'
  - name: macwarden-nwc
    keywords:
      - 'walletconnect'
    regex:
      uri: '(?i)(?:nostr\+walletconnect|nostrwalletconnect):(?://)?[0-9a-f]{64}/?\?[^\s"''<>]*?secret=[0-9a-f]{64}(?:[^0-9a-f]|$)'
  - name: macwarden-l402
    keywords:
      - 'l402'
      - 'lsat'
    regex:
      credential: '(?i)\b(?:l402|lsat)[ \t]+[A-Za-z0-9+/_=-]{40,}(?:,[A-Za-z0-9+/_=-]{40,})*:[0-9a-f]{64}\b'
  - name: macwarden-l402-macaroon-hex
    keywords:
      - '0201046c73617402420000'
    regex:
      macaroon: '(?i)0201046c73617402420000[0-9a-f]{40,}'
  - name: macwarden-l402-macaroon-base64
    keywords:
      - 'AgEEbHNhdAJCAA'
    regex:
      macaroon: 'AgEEbHNhdAJCAA[A-Za-z0-9+/_-]{40,}={0,2}'
