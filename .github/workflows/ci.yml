name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Every platform reports its own result; one failure does not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.23.2', '22.x', '24.18.1', '24.x']
        include:
          - { os: windows-latest, node: '22.23.2' }
          - { os: windows-latest, node: '24.x' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      # npm test builds first (pretest), so the tests always run against a fresh dist.
      - run: npm test
      # The harness, documentation and configuration contracts are a separate Vitest project.
      - run: npm run test:harness
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run build
      - run: npm run fixture:up
      - run: npm run test:oracle
      - if: always()
        run: npm run fixture:down
  # The Core Lightning rune comparison runs in its own job, so an LND oracle failure cannot skip it.
  cln-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run build
      - run: npm run fixture:cln:up
      - run: npm run test:cln-oracle
      - if: always()
        run: npm run fixture:cln:down
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run build
      # The gitleaks tests need private, owner-only scratch and sentinel directories inside the checkout.
      - run: |
          umask 077
          mkdir -p .ratchet/packets
          echo "MACWARDEN_TEST_TMP=$(mktemp -d "$PWD/.ratchet/packets/gl-tmp-XXXXXX")" >> "$GITHUB_ENV"
          echo "MACWARDEN_SENTINEL_DIR=$(mktemp -d "$PWD/.ratchet/packets/gl-sent-XXXXXX")" >> "$GITHUB_ENV"
      - run: npm run test:gitleaks
