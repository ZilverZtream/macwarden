name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ['22.23.2', '22.x', '24.18.1', '24.x']
        include:
          - { os: windows-latest, node: '22.23.2' }
          - { os: windows-latest, node: '24.x' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run build
      - run: npm run fixture:up
      - run: npm run test:oracle
      - if: always()
        run: npm run fixture:down
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - run: npm ci
      - run: npm run build
      # The gitleaks tests need private, owner-only scratch and sentinel directories inside the checkout.
      - run: |
          umask 077
          mkdir -p .ratchet/packets
          echo "MACWARDEN_TEST_TMP=$(mktemp -d "$PWD/.ratchet/packets/gl-tmp-XXXXXX")" >> "$GITHUB_ENV"
          echo "MACWARDEN_SENTINEL_DIR=$(mktemp -d "$PWD/.ratchet/packets/gl-sent-XXXXXX")" >> "$GITHUB_ENV"
      - run: npm run test:gitleaks
