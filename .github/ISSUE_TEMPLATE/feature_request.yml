name: Feature request
description: Suggest a new capability or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials. Changes to how MacWarden handles credentials must keep the safety rules in docs/security-model.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: The command, flags and output you have in mind, and how it should fail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or manual steps you use today (for example lncli or Lightning Terminal).
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Does the change touch credentials, the node, the registry or files on disk? Which SAFE rules apply?
